<div id="cardinality-label-viz">
  <h2>Distribuição da amostra final</h2>
  <div class="viz-grid">
    <section>
      <h3>Tarefas por cardinalidade</h3>
      <div class="chart" id="cardinality-chart"></div>
    </section>
    <section>
      <h3>Ocorrências totais por label</h3>
      <div class="chart" id="labels-chart"></div>
    </section>
  </div>
  <p class="text-small text-muted">65 tarefas únicas e 130 anotações humanas. Uma tarefa multilabel contribui para mais de uma classe.</p>
</div>

<style>
  #cardinality-label-viz { width: 100%; }
  #cardinality-label-viz h2 { margin-bottom: 1rem; }
  #cardinality-label-viz h3 { margin-bottom: .5rem; }
  #cardinality-label-viz .viz-grid { align-items: start; }
  #cardinality-label-viz .chart { width: 100%; min-height: 310px; }
  #cardinality-label-viz svg { display: block; width: 100%; height: auto; }
  #cardinality-label-viz .cardinality-bar { fill: var(--viz-series-1); }
  #cardinality-label-viz .label-bar { fill: var(--viz-series-2); }
  #cardinality-label-viz .grid-line { stroke: var(--border); stroke-width: 1; }
  #cardinality-label-viz .frame { fill: none; stroke: var(--border); stroke-width: 1; }
  #cardinality-label-viz text { fill: var(--foreground); font-size: 12px; }
  #cardinality-label-viz .tick { fill: var(--muted-foreground); }
  #cardinality-label-viz .value { font-weight: 500; }
  #cardinality-label-viz .text-muted { margin-top: .75rem; }
</style>

<script>
(() => {
  const root = document.getElementById('cardinality-label-viz');
  const cardinalities = [
    { label: 'Vazias', value: 10 },
    { label: '1 label', value: 10 },
    { label: '2 labels', value: 10 },
    { label: '3 labels', value: 10 },
    { label: '4 labels', value: 10 },
    { label: '5 labels', value: 10 },
    { label: '6 labels', value: 5 }
  ];
  const labels = [
    { label: 'Ataque à reputação', value: 30 },
    { label: 'Justificativa', value: 35 },
    { label: 'Simplificação', value: 29 },
    { label: 'Distração', value: 29 },
    { label: 'Chamada', value: 29 },
    { label: 'Linguagem manipulativa', value: 28 },
    { label: 'Nenhuma', value: 10 }
  ];

  function draw(containerId, data, className, ceiling, ariaLabel) {
    const container = root.querySelector(`#${containerId}`);
    const width = Math.max(320, Math.floor(container.getBoundingClientRect().width));
    const height = 310;
    const margin = { top: 12, right: 46, bottom: 34, left: width < 430 ? 126 : 156 };
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;
    const rowHeight = innerHeight / data.length;
    const barHeight = Math.min(22, rowHeight * .62);
    const x = value => margin.left + (value / ceiling) * innerWidth;
    const ticks = Array.from({ length: 6 }, (_, index) => ceiling * index / 5);

    const guides = ticks.map(value => {
      const xpos = x(value);
      return `<line class="grid-line" x1="${xpos}" y1="${margin.top}" x2="${xpos}" y2="${margin.top + innerHeight}"/><text class="tick" x="${xpos}" y="${height - 10}" text-anchor="middle">${Math.round(value)}</text>`;
    }).join('');
    const bars = data.map((item, index) => {
      const y = margin.top + index * rowHeight + (rowHeight - barHeight) / 2;
      const barWidth = Math.max(1, x(item.value) - margin.left);
      const valueX = Math.min(width - 5, margin.left + barWidth + 6);
      return `<text x="${margin.left - 8}" y="${y + barHeight / 2 + 4}" text-anchor="end">${item.label}</text><rect class="${className}" x="${margin.left}" y="${y}" width="${barWidth}" height="${barHeight}" data-tooltip="${item.label}: ${item.value}"/><text class="value" x="${valueX}" y="${y + barHeight / 2 + 4}">${item.value}</text>`;
    }).join('');

    container.innerHTML = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${ariaLabel}"><title>${ariaLabel}</title><desc>Gráfico de barras horizontais com valores diretamente rotulados.</desc><rect class="frame" data-chart-frame x="${margin.left}" y="${margin.top}" width="${innerWidth}" height="${innerHeight}"/>${guides}${bars}<text class="axis-title" data-axis="x" x="${margin.left + innerWidth / 2}" y="${height - 1}" text-anchor="middle">Quantidade</text></svg>`;
  }

  function redraw() {
    draw('cardinality-chart', cardinalities, 'cardinality-bar', 10, 'Tarefas por quantidade de labels');
    draw('labels-chart', labels, 'label-bar', 40, 'Ocorrências totais por classe');
  }

  redraw();
  new ResizeObserver(redraw).observe(root);
})();
</script>
